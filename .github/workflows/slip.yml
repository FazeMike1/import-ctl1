name: slip
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: craft weird files
        run: |
          mkdir -p out/sub
          printf 'CANARY:parent'   > 'out/..\..\slip-winparent.txt'
          printf 'CANARY:deep'     > 'out/..\..\..\slip-deep.txt'
          printf 'CANARY:unc'      > 'out/\\server\share\slip-unc.txt'
          printf 'CANARY:nested'   > 'out/sub/..\..\slip-nested.txt'
          printf 'ok' > 'out/ok.txt'
          ls -la out out/sub
      - uses: actions/upload-artifact@v4
        with:
          name: slip
          path: out/
